# Local development infrastructure for WEB X-RAY.
# Ports are deliberately non-default so they don't collide with a host Postgres/Redis.
name: webxray

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webxray
      POSTGRES_PASSWORD: webxray_dev_password
      POSTGRES_DB: webxray
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webxray"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
