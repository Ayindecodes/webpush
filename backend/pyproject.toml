[project]
name = "webxray"
version = "0.1.0"
description = "WEB X-RAY control plane, browser worker, and investigation engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.0",
  "pydantic-settings==2.15.0",
  "email-validator>=2.2",
  "SQLAlchemy[asyncio]==2.1.4",
  "asyncpg==0.32.0",
  "alembic==1.20.0",
  "redis==8.1.0",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "dnspython==2.9.0",
  "playwright==1.63.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1", "python-multipart>=0.0.20"]  # multipart: demo shop

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["webxray*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "e2e: end-to-end tests that launch Chromium against the demo shop",
]
